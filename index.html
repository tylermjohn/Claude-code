<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude's Cookbook - Recipe Suggester</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div class="claude-logo">
                    <svg width="80" height="80" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="45" fill="#CC785C"/>
                        <path d="M 30 45 Q 50 25 70 45" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
                        <circle cx="38" cy="42" r="4" fill="white"/>
                        <circle cx="62" cy="42" r="4" fill="white"/>
                        <path d="M 35 60 Q 50 70 65 60" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
                        <path d="M 20 35 Q 25 20 35 25" stroke="#CC785C" stroke-width="8" fill="none" stroke-linecap="round"/>
                        <path d="M 80 35 Q 75 20 65 25" stroke="#CC785C" stroke-width="8" fill="none" stroke-linecap="round"/>
                    </svg>
                </div>
                <h1>Claude's Cookbook</h1>
                <p class="tagline">Turn your ingredients into delicious meals ✨</p>
            </div>
        </header>

        <main>
            <section class="ingredient-section">
                <h2>What's in your fridge?</h2>

                <div class="search-box">
                    <input
                        type="text"
                        id="ingredient-search"
                        placeholder="Search ingredients..."
                        autocomplete="off"
                    >
                    <div id="suggestions" class="suggestions"></div>
                </div>

                <div id="selected-ingredients" class="selected-ingredients">
                    <div class="empty-state">
                        <span class="empty-icon">🥕</span>
                        <p>Start adding ingredients to find recipes!</p>
                    </div>
                </div>

                <div class="staples-section">
                    <h3>Staples & Spices</h3>
                    <p class="staples-subtitle">Check the basics you have in your pantry</p>
                    <div id="staples-grid" class="staples-grid"></div>
                </div>
            </section>

            <section class="recipes-section">
                <div class="section-header">
                    <h2>Recipe Suggestions</h2>
                    <div class="recipe-count" id="recipe-count"></div>
                </div>

                <div id="recipes-container" class="recipes-container">
                    <div class="empty-state">
                        <span class="empty-icon">👨‍🍳</span>
                        <p>Add some ingredients and I'll suggest delicious recipes!</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="recipe-modal" class="modal">
        <div class="modal-content">
            <button class="close-btn">&times;</button>
            <div id="recipe-details"></div>
        </div>
    </div>

    <script src="recipes.js"></script>
    <script src="app.js"></script>
</body>
</html>
